[package]
name = "project-almost"
version = "0.1.0"
description = "Project Almost rebuild desktop shell"
authors = ["Project Almost Contributors"]
edition = "2021"

[lib]
name = "project_almost_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
